<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parking">
<meta name="theme-color" content="#f9a8d4">
<link rel="manifest" href="/manifest.json">
<title>Parking Lot</title>
<style>
  :root { --pink:#f9a8d4; --pink2:#fce7f3; --aqua:#99f6e4; --aqua2:#ccfbf1; --ink:#4a3a4f; --soft:#8b7b90; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color:var(--ink);
         background: linear-gradient(160deg, #fdf2f8 0%, #f0fdfa 100%); min-height:100vh; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:1.6rem; margin:8px 0 2px; }
  .sub { color:var(--soft); margin:0 0 18px; font-size:.95rem; }
  form { display:flex; gap:8px; margin-bottom:22px; }
  input { flex:1; padding:14px 16px; border-radius:18px; border:2px solid var(--pink2); font-size:1rem;
          background:#fff; color:var(--ink); outline:none; }
  input:focus { border-color:var(--pink); }
  button { border:0; border-radius:16px; padding:10px 14px; font-size:.95rem; cursor:pointer; font-family:inherit; }
  .park { background:var(--pink); color:#fff; font-weight:700; padding:14px 18px; }
  h2 { font-size:1rem; text-transform:uppercase; letter-spacing:.08em; color:var(--soft); margin:22px 0 8px; }
  .card { background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:10px;
          box-shadow:0 2px 10px rgba(249,168,212,.18); }
  .card.forward { border-left:6px solid var(--aqua); }
  .card.done { opacity:.55; }
  .card.done .t { text-decoration:line-through; }
  .t { font-size:1.02rem; line-height:1.35; word-wrap:break-word; }
  .meta { color:var(--soft); font-size:.8rem; margin:4px 0 10px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .acts button { background:var(--pink2); color:var(--ink); }
  .acts .fw { background:var(--aqua2); }
  .acts .del { background:transparent; color:var(--soft); }
  .empty { color:var(--soft); font-style:italic; padding:6px 2px; }
  details summary { cursor:pointer; color:var(--soft); margin-top:22px; }
  .shelf { background:#fff; border-radius:22px; padding:16px; margin-bottom:22px;
           box-shadow:0 2px 12px rgba(153,246,228,.35); border:2px solid var(--aqua2); }
  .shelf h3 { margin:0 0 4px; font-size:1.05rem; }
  .bar { height:14px; background:var(--pink2); border-radius:10px; overflow:hidden; margin:8px 0 4px; }
  .fill { height:100%; background:linear-gradient(90deg, var(--pink), var(--aqua)); border-radius:10px; transition:width .4s; }
  .stk { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .stk span { font-size:1.7rem; cursor:pointer; filter:drop-shadow(0 1px 2px rgba(0,0,0,.12)); }
  .why { color:var(--soft); font-size:.88rem; min-height:1.2em; margin-top:6px; }
  .rw { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px dashed var(--pink2); }
  .rw button { background:var(--aqua2); }
  .rw button:disabled { opacity:.35; }
</style>
</head>
<body>
<main>
  <h1>🅿️ Parking Lot</h1>
  <p class="sub">Parked ideas are safe. Nothing here is late. 🌿</p>
  <div class="shelf">
    <h3>🌟 Sticker shelf</h3>
    <div id="prog" class="sub" style="margin:0"></div>
    <div class="bar"><div id="fill" class="fill" style="width:0%"></div></div>
    <div id="stk" class="stk"></div>
    <div id="why" class="why">Tap a sticker to see what it was for.</div>
    <details><summary>Rewards</summary><div id="rw"></div></details>
  </div>
  <form id="f">
    <input id="txt" placeholder="Park a thought…" autocomplete="off" maxlength="500">
    <button class="park" type="submit">Park</button>
  </form>
  <h2>Brought forward</h2><div id="forward"></div>
  <h2>Parked</h2><div id="parked"></div>
  <details><summary>Done</summary><div id="done"></div></details>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  return r.json();
}
function fmt(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function card(it){
  const btns = [];
  if (it.status!=='forward') btns.push(`<button class="fw" data-a="forward" data-id="${it.id}">Bring forward</button>`);
  if (it.status!=='parked') btns.push(`<button data-a="parked" data-id="${it.id}">Re-park</button>`);
  if (it.status!=='done') btns.push(`<button data-a="done" data-id="${it.id}">Done ✓</button>`);
  btns.push(`<button class="del" data-a="del" data-id="${it.id}">remove</button>`);
  return `<div class="card ${it.status}"><div class="t">${esc(it.text)}</div>
    <div class="meta">parked ${fmt(it.created)} · by ${esc(it.by)}</div><div class="acts">${btns.join('')}</div></div>`;
}
async function load(){
  const d = await api('/api/items');
  for (const s of ['forward','parked','done']) {
    const items = d.items.filter(i=>i.status===s).reverse();
    $(s).innerHTML = items.length ? items.map(card).join('') : '<div class="empty">nothing here</div>';
  }
}
let SD = null;
async function loadStickers(){
  SD = await api('/api/stickers');
  const p = SD.progress, g = SD.goal, ready = p >= g;
  $('prog').textContent = ready ? `${p} / ${g}: you can claim a reward! 🎉` : `${p} / ${g} until your next reward · ${SD.stickers.length} earned all-time`;
  $('fill').style.width = Math.min(100, p / g * 100) + '%';
  $('stk').innerHTML = SD.stickers.length ? SD.stickers.map((s,i)=>`<span data-s="${i}" title="${esc(s.reason)}">${s.emoji}</span>`).join('') : '<div class="empty">your first one is coming 😏</div>';
  $('rw').innerHTML = SD.rewards.map(r=>`<div class="rw"><span>${r.emoji} ${esc(r.text)}</span><button data-r="${r.id}" ${ready?'':'disabled'}>Claim</button></div>`).join('')
    + (SD.claims.length ? `<div class="meta" style="margin-top:8px">Claimed: ${SD.claims.map(c=>esc(c.text)+' ('+fmt(c.at)+')').join(' · ')}</div>` : '');
}
$('stk').onclick = e => { const s = e.target.closest('[data-s]'); if(!s) return;
  const st = SD.stickers[+s.dataset.s]; $('why').textContent = `${st.emoji} ${st.reason} · ${fmt(st.at)}`; };
$('rw').onclick = async e => { const b = e.target.closest('button[data-r]'); if(!b) return;
  if(!confirm('Claim this reward? Then go enjoy it.')) return;
  await api('/api/claim',{method:'POST', body:JSON.stringify({reward:b.dataset.r})}); loadStickers(); };
loadStickers(); setInterval(loadStickers, 30000);
$('f').onsubmit = async e => {
  e.preventDefault();
  const t = $('txt').value.trim(); if(!t) return;
  await api('/api/items',{method:'POST', body:JSON.stringify({text:t, by:'me'})});
  $('txt').value=''; load();
};
document.body.onclick = async e => {
  const b = e.target.closest('button[data-a]'); if(!b) return;
  if (b.dataset.a==='del') { if(!confirm('Remove this for good?')) return;
    await api('/api/items/'+b.dataset.id,{method:'DELETE'}); }
  else await api('/api/items/'+b.dataset.id,{method:'POST', body:JSON.stringify({status:b.dataset.a})});
  load();
};
load(); setInterval(load, 30000);
</script>
</body>
</html>
